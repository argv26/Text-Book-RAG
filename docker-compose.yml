version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: textbook_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: textbook_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ingestion/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:

